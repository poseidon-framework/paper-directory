name: Validate list.csv

on:
  pull_request:
    paths:
      - 'list.csv'
  push:
    branches-ignore:
      - main  # main is covered by deploy.yml, which also validates before committing
    paths:
      - 'list.csv'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Validate list.csv
        run: python scripts/validate_list_csv.py
